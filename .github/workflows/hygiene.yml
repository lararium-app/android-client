name: Hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No machine-local build config
        run: |
          hits=$(git ls-files | grep -E '(^|/)local\.properties$' || true)
          sdk_hits=$(git grep -I -l -E '^\s*sdk\.dir\s*=' 2>/dev/null || true)
          offending=$(printf "%s\n%s" "$hits" "$sdk_hits" | sed '/^$/d' | sort -u)
          if [ -n "$offending" ]; then
            echo "$offending"
            echo "machine-specific SDK config must not be committed"
            exit 1
          fi
      - name: Neutrality scan
        env:
          # Deny-list lives in a repo secret, NOT in this file: a
          # public repo cannot carry the strings it polices. Set it
          # with: gh secret set NEUTRALITY_DENYLIST --repo <repo>
          # (value: one regex, e.g. 'name1|host1|/home/user1').
          DENYLIST: ${{ secrets.NEUTRALITY_DENYLIST }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Product repo: zero personal identifiers, hostnames, home
          # paths, or hardware specifics in tracked files. (grep -I
          # skips binary assets; hits captured by content, not xargs
          # exit code — a partial-match batch exits 123 and must still
          # FAIL the job.) An unset secret means an empty pattern,
          # which matches nothing: the gate stays green but inert, so
          # set the secret in every fork too.
          if [ -z "$DENYLIST" ]; then
            echo "NEUTRALITY_DENYLIST secret not set — scan skipped (inert)"
            exit 0
          fi
          hits=$(git ls-files -z | xargs -0 grep -lI -i -E "$DENYLIST" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "personal identifiers found in tracked files (list above)"
            exit 1
          fi
          if [ -n "$BASE" ]; then
            msg_hits=0
            while read -r sha; do
              [ -z "$sha" ] && continue
              if git log -1 --format=%B "$sha" | grep -i -q -E "$DENYLIST"; then
                echo "$sha"
                msg_hits=1
              fi
            done < <(git log --format='%H' "$BASE..$HEAD")
            if [ "$msg_hits" -ne 0 ]; then
              echo "personal identifiers found in commit messages"; exit 1
            fi
          fi
      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          regex='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test|security)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          if ! printf '%s\n' "$TITLE" | grep -q -E "$regex"; then
            echo "PR title does not match conventional commits: $TITLE"
            bad=1
          fi
          if [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            while IFS= read -r sha; do
              [ -z "$sha" ] && continue
              subject=$(git log -1 --format="%s" "$sha")
              if ! printf '%s\n' "$subject" | grep -q -E "$regex"; then
                echo "$sha $subject"
                bad=1
              fi
            done < <(git rev-list --no-merges "$BASE..$HEAD")
          fi
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
