name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_local_ai:
        description: 'Build native llama.cpp libs so Local AI (on-device) works in the APK'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LARARIUM_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      LARARIUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      LARARIUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      LARARIUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
      - name: Branding hygiene check
        run: ./scripts/branding-hygiene.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # gradle/actions/setup-gradle v4
      - name: Cache Android NDK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_local_ai }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache v4
        with:
          path: ~/android-ndk
          key: android-ndk-r27b-linux
      - name: Build llama.cpp native libs (Local AI)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_local_ai }}
        run: |
          NDK_DIR=~/android-ndk/android-ndk-r27b
          if [ ! -d "$NDK_DIR" ]; then
            mkdir -p ~/android-ndk
            curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
            unzip -q /tmp/ndk.zip -d ~/android-ndk
          fi
          ./scripts/build-llama-android.sh "$NDK_DIR"
      - name: Verify native libs present
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_local_ai }}
        run: |
          for f in libggml-base.so libggml-cpu.so libggml.so libllama.so; do
            test -f "app/src/main/cpp/llama/prebuilt/arm64-v8a/$f" || { echo "MISSING $f"; exit 1; }
          done
          echo "All llama.cpp native libs present"
      - name: Generate gradle.properties (gitignored upstream)
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
      - name: Decode stable signing keystore
        if: ${{ env.LARARIUM_KEYSTORE_BASE64 != '' }}
        run: printf '%s' "$LARARIUM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lararium-release.jks"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        run: |
          SIGNING_ARGS=()
          if [ -n "$LARARIUM_KEYSTORE_BASE64" ]; then
            SIGNING_ARGS=(
              "-PLARARIUM_UPLOAD_STORE_FILE=$RUNNER_TEMP/lararium-release.jks"
              "-PLARARIUM_UPLOAD_STORE_PASSWORD=$LARARIUM_KEYSTORE_PASSWORD"
              "-PLARARIUM_UPLOAD_KEY_ALIAS=$LARARIUM_KEY_ALIAS"
              "-PLARARIUM_UPLOAD_KEY_PASSWORD=$LARARIUM_KEY_PASSWORD"
            )
          fi
          ./gradlew assembleDebug --no-daemon -x lint "${SIGNING_ARGS[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: lararium-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
