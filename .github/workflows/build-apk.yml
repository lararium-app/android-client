name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LARARIUM_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      LARARIUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      LARARIUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      LARARIUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Branding hygiene check
        run: ./scripts/branding-hygiene.sh
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # actions/setup-java v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # gradle/actions/setup-gradle v6.4.1
      - name: Decode stable signing keystore
        if: ${{ env.LARARIUM_KEYSTORE_BASE64 != '' }}
        run: printf '%s' "$LARARIUM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lararium-release.jks"
      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest --no-daemon
      - name: Assemble debug APK
        run: |
          SIGNING_ARGS=()
          if [ -n "$LARARIUM_KEYSTORE_BASE64" ]; then
            SIGNING_ARGS=(
              "-PLARARIUM_UPLOAD_STORE_FILE=$RUNNER_TEMP/lararium-release.jks"
              "-PLARARIUM_UPLOAD_STORE_PASSWORD=$LARARIUM_KEYSTORE_PASSWORD"
              "-PLARARIUM_UPLOAD_KEY_ALIAS=$LARARIUM_KEY_ALIAS"
              "-PLARARIUM_UPLOAD_KEY_PASSWORD=$LARARIUM_KEY_PASSWORD"
            )
          fi
          ./gradlew assembleGithubDebug --no-daemon -x lint "${SIGNING_ARGS[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: lararium-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
