name: Release APK

# Tag a commit `v*` (e.g. v0.9.5-alpha) and this builds the stable-signed
# debug APK and publishes the GitHub Release with it attached.
# If a draft release for the tag already exists (hand-written notes), the
# APK is uploaded to it and the release is published as authored.
# Uses the same ANDROID_KEYSTORE_* secrets as the CI build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.9.5-alpha"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      LARARIUM_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      LARARIUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      LARARIUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      LARARIUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Refuse unsigned releases
        run: |
          if [ -z "$LARARIUM_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_* secrets are required for releases (stable signing key)."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # gradle/actions/setup-gradle v4

      - name: Generate gradle.properties (gitignored upstream)
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

      - name: Decode stable signing keystore
        run: printf '%s' "$LARARIUM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lararium-release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble signed APK
        run: |
          ./gradlew assembleDebug --no-daemon -x lint \
            "-PLARARIUM_UPLOAD_STORE_FILE=$RUNNER_TEMP/lararium-release.jks" \
            "-PLARARIUM_UPLOAD_STORE_PASSWORD=$LARARIUM_KEYSTORE_PASSWORD" \
            "-PLARARIUM_UPLOAD_KEY_ALIAS=$LARARIUM_KEY_ALIAS" \
            "-PLARARIUM_UPLOAD_KEY_PASSWORD=$LARARIUM_KEY_PASSWORD"

      - name: Stage artifact + audit signing cert
        id: stage
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" "lararium-$TAG.apk"
          SHA=$(sha256sum "lararium-$TAG.apk" | cut -d' ' -f1)
          echo "apk=lararium-$TAG.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "::group::Signing certificate"
          "$APKSIGNER" verify --print-certs "lararium-$TAG.apk" | grep -i "SHA-256 digest" || true
          echo "::endgroup::"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="${{ steps.stage.outputs.apk }}"
          SHA="${{ steps.stage.outputs.sha256 }}"
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            # Author-drafted release: attach the binary, keep the notes, publish.
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --draft=false
          else
            printf 'Android %s\n\nAutomated build from tag `%s`, signed with the stable release key — installs straight over previous versions, no re-pairing needed.\n\n**SHA-256:** `%s`\n' \
              "$TAG" "$TAG" "$SHA" > notes.md
            gh release create "$TAG" "$APK" \
              --title "Android $TAG" \
              --notes-file notes.md
          fi
          echo "Published: https://github.com/${{ github.repository }}/releases/tag/$TAG"
