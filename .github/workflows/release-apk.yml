name: Release APK

# Tag a commit `v*` (e.g. v0.9.5-alpha) and this builds the stable-signed
# non-debuggable, minified release APK and publishes the GitHub Release with it attached.
# If a draft release for the tag already exists (hand-written notes), the
# APK is uploaded to it and the release is published as authored.
# Uses the same ANDROID_KEYSTORE_* secrets as the CI build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.9.5-alpha"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      LARARIUM_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      LARARIUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      LARARIUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      LARARIUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Refuse unsigned releases
        run: |
          if [ -z "$LARARIUM_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_* secrets are required for releases (stable signing key)."
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # actions/setup-java v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # gradle/actions/setup-gradle v6.4.1

      - name: Decode stable signing keystore
        run: printf '%s' "$LARARIUM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lararium-release.jks"

      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest --no-daemon

      - name: Assemble signed APK
        run: |
          ./gradlew assembleGithubRelease --no-daemon -x lint \
            "-PLARARIUM_UPLOAD_STORE_FILE=$RUNNER_TEMP/lararium-release.jks" \
            "-PLARARIUM_UPLOAD_STORE_PASSWORD=$LARARIUM_KEYSTORE_PASSWORD" \
            "-PLARARIUM_UPLOAD_KEY_ALIAS=$LARARIUM_KEY_ALIAS" \
            "-PLARARIUM_UPLOAD_KEY_PASSWORD=$LARARIUM_KEY_PASSWORD"

      - name: Stage artifact + audit signing cert
        id: stage
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/github/release/*.apk | head -1)
          cp "$APK" "lararium-$TAG.apk"
          SHA=$(sha256sum "lararium-$TAG.apk" | cut -d' ' -f1)
          echo "apk=lararium-$TAG.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "::group::Signing certificate"
          "$APKSIGNER" verify --print-certs "lararium-$TAG.apk" | grep -i "SHA-256 digest" || true
          echo "::endgroup::"

      - name: Refuse debuggable artifacts
        run: |
          set -euo pipefail
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          BADGING=$("$AAPT2" dump badging "${{ steps.stage.outputs.apk }}")
          if echo "$BADGING" | grep -qi "debuggable"; then
            echo "Refusing to publish: APK is marked debuggable."
            exit 1
          fi
          echo "APK is not debuggable."

      - name: Refuse version mismatch
        run: |
          set -euo pipefail
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          BUILT=$("$AAPT2" dump badging "${{ steps.stage.outputs.apk }}" \
            | sed -n "s/^package: name='[^']*' versionCode='[0-9]*' versionName='\([^']*\)'.*/\1/p" | head -1)
          EXPECTED="${TAG#v}"   # tag carries a conventional v-prefix; versionName does not
          if [ "$BUILT" != "$EXPECTED" ]; then
            echo "Refusing to publish: tag is $TAG but the APK reports versionName '$BUILT'."
            echo "Fix app/build.gradle.kts versionName on the tagged commit before releasing."
            exit 1
          fi
          echo "Version gate passed: APK versionName == $TAG."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="${{ steps.stage.outputs.apk }}"
          SHA="${{ steps.stage.outputs.sha256 }}"
          ASSETS=("$APK")
          MAPPING=app/build/outputs/mapping/githubRelease/mapping.txt
          if [ -f "$MAPPING" ]; then
            gzip -9 -c "$MAPPING" > "lararium-$TAG-mapping.txt.gz"
            ASSETS+=("lararium-$TAG-mapping.txt.gz")
          fi
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            # Author-drafted release: attach the binary, keep the notes, publish.
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --draft=false
          else
            printf 'Android %s\n\nAutomated build from tag `%s`, signed with the stable release key — installs straight over previous versions, no re-pairing needed.\n\n**SHA-256:** `%s`\n' \
              "$TAG" "$TAG" "$SHA" > notes.md
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Android $TAG" \
              --notes-file notes.md
          fi
          echo "Published: https://github.com/${{ github.repository }}/releases/tag/$TAG"
