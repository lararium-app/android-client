name: Play Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track (closed testing = alpha)'
        required: true
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      draft:
        description: 'Upload as draft release'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # One pipeline at a time: concurrent uploads open concurrent Play
  # edit sessions and the commits collide (see docs/PLAY-LANE.md).
  group: play-release
  cancel-in-progress: false

jobs:
  play-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LARARIUM_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      LARARIUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      LARARIUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      LARARIUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0

      - name: Branding hygiene check
        run: ./scripts/branding-hygiene.sh

      - name: Refuse unsigned releases
        run: |
          if [ -z "$LARARIUM_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_* secrets are required for releases (stable signing key)."
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # actions/setup-java v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # gradle/actions/setup-gradle v6.4.1

      - name: Decode stable signing keystore
        run: printf '%s' "$LARARIUM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lararium-release.jks"

      - name: Unit tests
        # AGP 9 creates unit-test components only for the tested (debug) build
        # type; the release variant has no test task to run.
        run: ./gradlew testPlayDebugUnitTest --no-daemon

      - name: Build release bundle
        run: |
          ./gradlew bundlePlayRelease --no-daemon -x lint \
            "-PLARARIUM_UPLOAD_STORE_FILE=$RUNNER_TEMP/lararium-release.jks" \
            "-PLARARIUM_UPLOAD_STORE_PASSWORD=$LARARIUM_KEYSTORE_PASSWORD" \
            "-PLARARIUM_UPLOAD_KEY_ALIAS=$LARARIUM_KEY_ALIAS" \
            "-PLARARIUM_UPLOAD_KEY_PASSWORD=$LARARIUM_KEY_PASSWORD"

      - name: Stage bundle artifact
        id: stage
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "lararium-$VERSION_NAME-$TRACK.aab"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: lararium-${{ steps.stage.outputs.versionName }}-${{ inputs.track }}.aab
          path: lararium-${{ steps.stage.outputs.versionName }}-${{ inputs.track }}.aab
          if-no-files-found: error

      # Note: `secrets` context is unreliable inside step-level `if`; the
      # repo pattern (build-apk.yml) is to test the job-env mirror instead.
      - name: Skip Play upload notification
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "PLAY_SERVICE_ACCOUNT_JSON secret is absent; skipping Google Play upload step gracefully."

      - name: Upload to Google Play (${{ inputs.track }} track)
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # r0adkll/upload-google-play v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.lararium
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          tracks: ${{ inputs.track }}
          releaseName: ${{ steps.stage.outputs.versionName }}
          status: ${{ (inputs.draft == false || inputs.draft == 'false') && 'completed' || 'draft' }}
