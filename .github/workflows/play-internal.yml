name: Play Internal

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Upload as draft release'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: play-internal
  cancel-in-progress: false

jobs:
  play-internal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LARARIUM_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      LARARIUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      LARARIUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      LARARIUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          fetch-depth: 0

      - name: Branding hygiene check
        run: ./scripts/branding-hygiene.sh

      - name: Refuse unsigned releases
        run: |
          if [ -z "$LARARIUM_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_* secrets are required for releases (stable signing key)."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # gradle/actions/setup-gradle v4

      - name: Generate gradle.properties (gitignored upstream)
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

      - name: Decode stable signing keystore
        run: printf '%s' "$LARARIUM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lararium-release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release bundle
        run: |
          ./gradlew bundleRelease --no-daemon -x lint \
            "-PLARARIUM_UPLOAD_STORE_FILE=$RUNNER_TEMP/lararium-release.jks" \
            "-PLARARIUM_UPLOAD_STORE_PASSWORD=$LARARIUM_KEYSTORE_PASSWORD" \
            "-PLARARIUM_UPLOAD_KEY_ALIAS=$LARARIUM_KEY_ALIAS" \
            "-PLARARIUM_UPLOAD_KEY_PASSWORD=$LARARIUM_KEY_PASSWORD"

      - name: Stage bundle artifact
        id: stage
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/bundle/release/app-release.aab "lararium-$VERSION_NAME-internal.aab"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: lararium-${{ steps.stage.outputs.versionName }}-internal.aab
          path: lararium-${{ steps.stage.outputs.versionName }}-internal.aab
          if-no-files-found: error

      # Note: `secrets` context is unreliable inside step-level `if`; the
      # repo pattern (build-apk.yml) is to test the job-env mirror instead.
      - name: Skip Play upload notification
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "PLAY_SERVICE_ACCOUNT_JSON secret is absent; skipping Google Play upload step gracefully."

      - name: Upload to Google Play internal track
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # r0adkll/upload-google-play v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.lararium
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          releaseName: ${{ steps.stage.outputs.versionName }}
          status: ${{ (inputs.draft == false || inputs.draft == 'false') && 'completed' || 'draft' }}
